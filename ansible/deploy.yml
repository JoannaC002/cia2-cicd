---
- name: Deploy application to Google Kubernetes Engine
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_tag: "7"
    image_name: "asia-south1-docker.pkg.dev/cia2-cicd-joan/cia2-docker-repo/cia2-cicd-app"

  tasks:
    - name: Update Kubernetes deployment image
      ansible.builtin.command:
        argv:
          - kubectl.exe
          - set
          - image
          - deployment/cia2-app
          - "cia2-cicd-app={{ image_name }}:{{ image_tag }}"

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl.exe
          - rollout
          - status
          - deployment/cia2-app
          - --timeout=180s

    - name: Verify deployed pods
      ansible.builtin.command:
        argv:
          - kubectl.exe
          - get
          - pods
          - -l
          - app=cia2-app