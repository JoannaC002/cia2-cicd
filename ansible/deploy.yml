
---
- name: Deploy application to Google Kubernetes Engine
  hosts: local
  gather_facts: false

  vars:
    deployment_name: cia2-app
    image_path: asia-south1-docker.pkg.dev/cia2-cicd-joan/cia2-docker-repo/cia2-cicd-app

  tasks:
    - name: Check that image tag was provided
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | string | length > 0
        fail_msg: "Jenkins image tag was not provided."

    - name: Get application container name
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - "{{ deployment_name }}"
          - -o
          - "jsonpath={.spec.template.spec.containers[0].name}"
      register: container
      changed_when: false

    - name: Update Kubernetes deployment image
      ansible.builtin.command:
        argv:
          - kubectl
          - set
          - image
          - "deployment/{{ deployment_name }}"
          - "{{ container.stdout }}={{ image_path }}:{{ image_tag }}"

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "deployment/{{ deployment_name }}"
          - --timeout=180s

    - name: Display deployed version
      ansible.builtin.debug:
        msg: "Successfully deployed image version {{ image_tag }}"
